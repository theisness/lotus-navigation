<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多网站集成平台</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义主题 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36CFC9',
            dark: '#1D2129',
            light: '#F2F3F5'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .sidebar-item-active {
        @apply bg-primary/10 text-primary border-l-4 border-primary;
      }
      .iframe-container {
        @apply w-full h-full transition-all duration-300 ease-in-out;
      }
    }
  </style>
  
  <style>
    body, html {
      height: 100%;
      overflow: hidden;
    }
    
    .iframe-wrapper {
      transition: opacity 0.3s ease-in-out;
    }
    
    .iframe-wrapper.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* 侧栏折叠时移除布局占位 */
    .sidebar-collapsed #sidebar { display: none; }
    
    /* 梯形箭头切换按钮（在侧栏右侧垂直居中） */
    #toggleSidebar.toggle-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 64px;
      background: #165DFF;
      color: #fff;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0 0, 100% 15%, 100% 85%, 0 100%);
    }
    .sidebar-open #toggleSidebar.toggle-arrow { left: calc(14rem - 24px); }
    .sidebar-collapsed #toggleSidebar.toggle-arrow { left: 0; }
    #toggleSidebar.toggle-arrow:hover { background: #0D46CC; }
    #toggleSidebar.toggle-arrow i { font-size: 16px; line-height: 1; }
    
    /* 加载动画 */
    .loader {
      border-top-color: #165DFF;
      animation: spinner 0.8s linear infinite;
    }
    
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="font-inter bg-gray-50 text-dark">
  <div id="app" class="flex h-screen sidebar-open">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="w-56 bg-white shadow-lg z-20 transition-all duration-300 ease-in-out">
      <div class="p-5 border-b">
        <h1 class="text-xl font-bold text-primary flex items-center">
          <i class="fa fa-globe mr-2"></i>
          <span>网站集成平台</span>
        </h1>
        <div class="mt-3 space-y-1">
          <div id="currentSiteTitle" class="text-sm font-medium text-gray-700">影院</div>
          <div id="currentSiteUrl" class="text-xs text-gray-500">https://ssbx.site</div>
          <div class="flex items-center space-x-3 mt-2">
            <button id="refreshBtn" class="text-gray-500 hover:text-primary transition-colors"><i class="fa fa-refresh"></i></button>
            <button id="fullscreenBtn" class="text-gray-500 hover:text-primary transition-colors"><i class="fa fa-expand"></i></button>
          </div>
        </div>
      </div>
      
      <nav class="p-4">
        <ul class="space-y-1">
          <li>
            <a href="#" class="website-link sidebar-item-active flex items-center p-3 rounded-lg transition-all" data-target="siteA">
              <i class="fa fa-google w-5 text-center mr-3"></i>
              <span>影院</span>
            </a>
          </li>
          <li>
            <a href="#" class="website-link flex items-center p-3 rounded-lg transition-all hover:bg-gray-100" data-target="siteB">
              <i class="fa fa-github w-5 text-center mr-3"></i>
              <span>社区</span>
            </a>
          </li>
          <li>
            <a href="#" class="website-link flex items-center p-3 rounded-lg transition-all hover:bg-gray-100" data-target="siteC">
              <i class="fa fa-twitter w-5 text-center mr-3"></i>
              <span>命理社区</span>
            </a>
          </li>
        </ul>
        
      </nav>
      
      <!-- 移动端关闭按钮 -->
      <button id="closeSidebar" class="lg:hidden absolute top-4 right-4 text-gray-500 hover:text-gray-700">
        <i class="fa fa-times text-xl"></i>
      </button>
    </aside>
    
    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
      <button id="toggleSidebar" class="toggle-arrow" aria-label="切换侧栏">
        <i class="fa fa-angle-left"></i>
      </button>

    <!-- 网站内容显示区 -->
    <div class="flex-1 relative overflow-hidden bg-gray-100">
      <!-- 加载指示器 -->
      <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-white/80 z-50">
        <div class="loader w-12 h-12 rounded-full border-4 border-gray-200"></div>
      </div>
      
      <!-- 网站A的iframe容器 -->
      <div id="siteA" class="iframe-wrapper absolute inset-0">
        <iframe src="https://ssbx.site" class="iframe-container" frameborder="0" allowfullscreen></iframe>
      </div>
      
      <!-- 网站B的iframe容器 -->
      <div id="siteB" class="iframe-wrapper absolute inset-0 hidden">
        <iframe src="https://blog.ssbx.site" class="iframe-container" frameborder="0" allowfullscreen></iframe>
      </div>
      
      <!-- 网站C的iframe容器 -->
      <div id="siteC" class="iframe-wrapper absolute inset-0 hidden">
        <iframe src="https://destiny.ssbx.site" class="iframe-container" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
    </main>
  </div>

  <script>
    // 获取DOM元素
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const websiteLinks = document.querySelectorAll('.website-link');
    const iframeWrappers = document.querySelectorAll('.iframe-wrapper');
    const iframes = document.querySelectorAll('iframe');
    const currentSiteTitle = document.getElementById('currentSiteTitle');
    const currentSiteUrl = document.getElementById('currentSiteUrl');
    const refreshBtn = document.getElementById('refreshBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const loader = document.getElementById('loader');
    
    // 网站信息映射
    const siteInfo = {
      siteA: { title: '影院', url: 'https://ssbx.site' },
      siteB: { title: '社区', url: 'https://blog.ssbx.site' },
      siteC: { title: '命理社区', url: 'https://destiny.ssbx.site' }
    };
    
    // 切换按钮箭头方向
    const toggleIcon = toggleSidebar.querySelector('i');
    function updateArrow() {
      const isCollapsed = document.getElementById('app').classList.contains('sidebar-collapsed');
      if (isCollapsed) {
        toggleIcon.classList.remove('fa-angle-left');
        toggleIcon.classList.add('fa-angle-right');
      } else {
        toggleIcon.classList.remove('fa-angle-right');
        toggleIcon.classList.add('fa-angle-left');
      }
    }
    updateArrow();
    
    // 侧边栏切换
    const appRoot = document.getElementById('app');
    toggleSidebar.addEventListener('click', () => {
      const isCollapsed = appRoot.classList.toggle('sidebar-collapsed');
      appRoot.classList.toggle('sidebar-open', !isCollapsed);
      // 同时显示/隐藏侧栏并移除占位
      sidebar.style.display = isCollapsed ? 'none' : 'block';
      updateArrow();
    });
    
    closeSidebar.addEventListener('click', () => {
      appRoot.classList.add('sidebar-collapsed');
      appRoot.classList.remove('sidebar-open');
      sidebar.style.display = 'none';
      updateArrow();
    });
    
    // 切换网站
    websiteLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        // 更新侧边栏选中状态
        websiteLinks.forEach(l => l.classList.remove('sidebar-item-active'));
        link.classList.add('sidebar-item-active');
        
        // 获取目标网站ID
        const targetId = link.getAttribute('data-target');
        
        // 显示加载状态
        showLoader();
        
        // 隐藏所有网站容器，显示目标网站容器
        setTimeout(() => {
          iframeWrappers.forEach(wrapper => {
            wrapper.classList.add('hidden');
          });
          
          const targetWrapper = document.getElementById(targetId);
          targetWrapper.classList.remove('hidden');
          
          // 更新标题和URL显示
          currentSiteTitle.textContent = siteInfo[targetId].title;
          currentSiteUrl.textContent = siteInfo[targetId].url;
          
          // 在移动设备上自动关闭侧边栏
          if (window.innerWidth < 1024) {
            sidebar.classList.add('-translate-x-full');
          }
          
          // 隐藏加载状态
          hideLoader();
        }, 300);
      });
    });
    
    // 刷新当前页面
    refreshBtn.addEventListener('click', () => {
      showLoader();
      
      // 找到当前显示的iframe并刷新
      iframeWrappers.forEach(wrapper => {
        if (!wrapper.classList.contains('hidden')) {
          const iframe = wrapper.querySelector('iframe');
          iframe.src = iframe.src;
          
          // 3秒后自动隐藏加载状态（实际应根据iframe加载完成事件处理）
          setTimeout(hideLoader, 3000);
        }
      });
    });
    
    // 全屏切换
    fullscreenBtn.addEventListener('click', () => {
      const mainContent = document.querySelector('main');
      
      if (!document.fullscreenElement) {
        mainContent.requestFullscreen().catch(err => {
          console.error(`全屏请求错误: ${err.message}`);
        });
        fullscreenBtn.innerHTML = '<i class="fa fa-compress"></i>';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fullscreenBtn.innerHTML = '<i class="fa fa-expand"></i>';
        }
      }
    });
    
    // 监听全屏状态变化
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenBtn.innerHTML = '<i class="fa fa-expand"></i>';
      }
    });
    
    // 加载状态控制函数
    function showLoader() {
      loader.classList.remove('hidden');
    }
    
    function hideLoader() {
      loader.classList.add('hidden');
    }
    
    // 监听iframe加载事件
    iframes.forEach(iframe => {
      iframe.addEventListener('load', () => {
        hideLoader();
      });
    });
    
    // 初始加载显示
    window.addEventListener('load', () => {
      hideLoader();
    });
  </script>
</body>
</html>
